name: CI + Deploy Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ai-engine/test_smoke.py

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ! grep -rniE "api[_-]?key\s*[:=]\s*['\"][^'\"]{8,}|secret\s*[:=]\s*['\"][^'\"]{8,}|-----BEGIN .*PRIVATE KEY" \
            --include="*.js" --include="*.html" --include="*.py" --include="*.json" . \
            | grep -v ".env.example" | grep -v "API_BASE" || true
          echo "Secret scan OK"

# Deploy: integración oficial Vercel ↔ GitHub (Project → Settings → Git).
# Cada push a main despliega a producción automáticamente tras estos checks.
